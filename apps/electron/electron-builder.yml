appId: com.lukilabs.craft-agent
productName: Craft Agents
copyright: Copyright © 2026 Craft Docs Ltd.

electronVersion: "39.2.7"

# Hook to compile macOS 26+ Liquid Glass icon after packaging
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: resources

# This list is the app-content allowlist, and it only holds while NO
# platform-level list (mac.files / win.files / linux.files) exists.
# electron-builder >= 26 normalizes this list into a *secondary* FileSet matcher
# (util/config/config.js -> normalizeFiles/mergeFileSets) and feeds the
# platform-level lists into the *primary* one. A primary matcher that contains
# nothing but `!` rules is treated as "exclude a few, keep the rest":
# electron-builder then prepends `**/*` (fileMatcher.js, containsOnlyIgnore()),
# which silently bypasses this allowlist and packs the whole app directory
# (src/, spike/, scripts/, eslint-rules/, ...).
# Platform-specific binaries (Bun, uv, Pi subprocess) therefore ship through the
# per-platform `extraResources` blocks below, never through a `files` list.
files:
  - dist/**/*
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json
  # Note: Bundled assets (docs, themes, permissions, tool-icons) are in resources/
  # and copied to dist/resources/ by build:copy. They're included via dist/**/* above.
  # Include network interceptor for API error capture and MCP schema injection
  - packages/shared/src/unified-network-interceptor.ts
  - packages/shared/src/interceptor-common.ts
  - packages/shared/src/feature-flags.ts
  - packages/shared/src/interceptor-request-utils.ts
  # Include CLI tool Python scripts (platform-independent)
  - resources/scripts/**/*
  # Include CLI tool shell wrappers (platform-independent, both Unix and Windows)
  - resources/bin/markitdown
  - resources/bin/markitdown.cmd
  - resources/bin/pdf-tool
  - resources/bin/pdf-tool.cmd
  - resources/bin/xlsx-tool
  - resources/bin/xlsx-tool.cmd
  - resources/bin/doc-diff
  - resources/bin/doc-diff.cmd
  - resources/bin/img-tool
  - resources/bin/img-tool.cmd
  - resources/bin/docx-tool
  - resources/bin/docx-tool.cmd
  - resources/bin/pptx-tool
  - resources/bin/pptx-tool.cmd
  - resources/bin/ical-tool
  - resources/bin/ical-tool.cmd
  # Platform-specific binaries (Bun runtime, uv, Pi subprocess) are NOT listed
  # here — they ship via the per-platform `extraResources` blocks below.
  # Exclude everything from node_modules (will use extraResources for SDK)
  - "!node_modules/**/*"

# Since SDK 0.2.113 the SDK ships a thin core (`@anthropic-ai/claude-agent-sdk`)
# and a per-platform optional dependency (`-darwin-arm64`, `-darwin-x64`, etc.)
# containing the ~210 MB native `claude` binary. We bundle both as extraResources
# below — only the binary matching the build target is shipped per artifact.
#
# Why extraResources instead of `files`: since electron-builder v20.15.2,
# `node_modules` directories are auto-excluded from `files`. extraResources
# bypasses that. See: https://github.com/electron-userland/electron-builder/issues/3104
#
# Ripgrep is sourced from `@vscode/ripgrep` (was previously bundled inside the
# SDK as `vendor/ripgrep/<platform>/rg`; removed in 0.2.113).

extraMetadata:
  main: dist/main.cjs

# Auto-update: electron-updater fetches from this URL for update manifests (.yml files)
publish:
  provider: generic
  url: https://thecraftagents.com/electron/latest

# Disable ASAR to avoid decompression overhead and click delays
asar: false

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  # macOS 26+ Liquid Glass: Tell macOS to look for icon in Assets.car
  # The value must match --app-icon used in actool (see afterPack.js)
  extendInfo:
    CFBundleIconName: AppIcon
    # Required for macOS to list the app under Privacy & Security > Local Network
    # and prompt for permission. Without it the app is silently denied LAN access
    # and never appears in the privacy pane (craft-agents-oss#938).
    NSLocalNetworkUsageDescription: "Craft Agents uses your local network to reach LAN addresses and devices you ask an agent to access, such as local servers or APIs."
  # Arch comes from the CLI (--arm64 / --x64), NOT from a per-target list.
  # The mac dist scripts stage a matching Bun per arch and build one arch at a
  # time; a target `arch` list here makes a single `--mac --arm64` invocation
  # build BOTH arches and ship one arch's Bun inside the other's artifact.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # Thin core SDK (sdk.mjs + types). ~4 MB — present on every platform.
    # Sourced from the hoisted ROOT node_modules; apps/electron has no own
    # node_modules in this monorepo (that's why the packaged app previously
    # shipped without the SDK when built via `electron:dist:mac`).
    - from: ../../node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    # Per-platform native `claude` binary package, matched to the build target
    # arch via the ${arch} macro (e.g. claude-agent-sdk-darwin-arm64).
    # The runtime resolver (runtime-resolver.ts) looks this package up at
    # app/node_modules/@anthropic-ai/claude-agent-sdk-darwin-${arch}/claude.
    # NOTE: for a target arch whose binary is absent from root node_modules the
    # copy is skipped (electron-builder warns) and that artifact runs without
    # the native binary — build-dmg.sh remains the canonical cross-arch path.
    - from: ../../node_modules/@anthropic-ai/claude-agent-sdk-darwin-${arch}
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-darwin-${arch}
    # ripgrep (used by packages/server-core/src/services/search.ts).
    - from: ../../node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
    # Bundled Bun runtime, staged by scripts/fetch-bun.ts for the target arch.
    # `to: app/...` keeps it at Resources/app/vendor/bun, exactly where the
    # runtime resolves it (CRAFT_BUN / runtime-resolver).
    - from: vendor/bun/bun
      to: app/vendor/bun/bun
    # Bundled uv binary for the target arch (resources/bin/<platform>-<arch>/).
    - from: resources/bin/darwin-${arch}
      to: app/resources/bin/darwin-${arch}
    # Pi agent server subprocess (for Pi SDK sessions).
    - from: resources/pi-agent-server
      to: app/resources/pi-agent-server
    # Desktop driver (`computer_tool`): the JS SDK, its platform payload, and the
    # N-API bridge it loads. Optional at build time — a machine without the
    # package still produces an app that simply does not advertise `computer`.
    # Same `app/node_modules` layout the runtime resolves from.
    - from: ../../node_modules/@trycua/cua-driver
      to: app/node_modules/@trycua/cua-driver
    - from: ../../node_modules/@trycua/cua-driver-darwin-${arch}
      to: app/node_modules/@trycua/cua-driver-darwin-${arch}
    - from: ../../node_modules/@ubjs/core
      to: app/node_modules/@ubjs/core
    - from: ../../node_modules/@ubjs/node
      to: app/node_modules/@ubjs/node
    - from: ../../node_modules/@ubjs/node-darwin-${arch}
      to: app/node_modules/@ubjs/node-darwin-${arch}
  # No platform-level `files` list here on purpose — see the note above `files`.
  # Use predictable naming for macOS packages (applies to zip; dmg uses its own config below)
  artifactName: "Craft-Agents-${arch}.${ext}"
  # Code signing & notarization (disabled by default for local builds)
  # To enable: set CSC_LINK, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # notarize:
  #   teamId: ${APPLE_TEAM_ID}

dmg:
  # Use predictable naming: Craft-Agents-arm64.dmg, Craft-Agents-x64.dmg
  artifactName: "Craft-Agents-${arch}.dmg"
  # Custom background (multi-resolution TIFF with 1x+2x for retina support)
  background: resources/dmg-background.tiff
  # Use app icon as the mounted volume icon in Finder
  icon: resources/icon.icns
  iconSize: 80
  title: "Craft Agents"
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    # Portable / "green" build: zips the contents of win-unpacked (same layout
    # mac's zip target produces), so it unpacks straight to `Craft Agents.exe`.
    # The archive target does not write update info, so this adds no entry to
    # latest.yml — and the portable build therefore never auto-updates.
    - target: zip
      arch:
        - x64
  # Use predictable naming: Craft-Agents-x64.exe / Craft-Agents-x64.zip
  artifactName: "Craft-Agents-${arch}.${ext}"
  # No platform-level `files` list here on purpose — see the note above `files`.
  # Copy executables as extraResources instead of `files`: electron-builder's npm
  # node module collector causes EBUSY errors when copying .exe files because it
  # scans/locks files while simultaneously trying to copy them. Moving them to
  # extraResources avoids this by copying before the collector runs.
  # See: https://github.com/electron-userland/electron-builder/issues/8250
  extraResources:
    # SDK core from root node_modules (monorepo hoisting — no node_modules in apps/electron/)
    - from: ../../node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    # SDK native binary — use platform-specific package (build script creates
    # claude-agent-sdk-binary alias, but it doesn't exist in root node_modules;
    # runtime-resolver.ts falls back to the platform-specific package).
    - from: ../../node_modules/@anthropic-ai/claude-agent-sdk-win32-x64
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64
    # ripgrep from root node_modules
    - from: ../../node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # `to: app/...` keeps Bun at `Resources/app/vendor/bun/`, exactly where the
    # runtime resolves it (CRAFT_BUN / runtime-resolver) — the same layout as
    # macOS and Linux. Without the `app/` prefix it landed at
    # `Resources/vendor/bun/` and only worked via the resolver's fallback scan.
    - from: vendor/bun/bun.exe
      to: app/vendor/bun/bun.exe
    - from: resources/bin/win32-x64
      to: app/resources/bin/win32-x64
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
    # Pi agent server subprocess (for Pi SDK sessions).
    - from: resources/pi-agent-server
      to: app/resources/pi-agent-server
    # Desktop driver (`computer_tool`) — optional at build time; absent means
    # `computer` is simply not advertised. See the macOS block for the layout.
    - from: ../../node_modules/@trycua/cua-driver
      to: app/node_modules/@trycua/cua-driver
    - from: ../../node_modules/@trycua/cua-driver-win32-${arch}-msvc
      to: app/node_modules/@trycua/cua-driver-win32-${arch}-msvc
    - from: ../../node_modules/@ubjs/core
      to: app/node_modules/@ubjs/core
    - from: ../../node_modules/@ubjs/node
      to: app/node_modules/@ubjs/node
    - from: ../../node_modules/@ubjs/node-win32-${arch}-msvc
      to: app/node_modules/@ubjs/node-win32-${arch}-msvc
    # koffi — a Win32 FFI used only on Windows, to set the browser window's
    # AppUserModel.PreventPinning property (see docs/browser-taskbar-plan.md).
    # asar is off and node_modules is excluded from `files`, so like the SDK it
    # travels as a resource instead.
    #
    # Both halves of koffi must ship: `koffi` is only the JS wrapper, and the
    # prebuilt binary lives in the per-platform `@koromix/koffi-*` package —
    # koffi 3.x moved the .node out of `koffi/build`, where koffi 2.x kept it.
    # koffi resolves the binary at `<koffi>/../../../@koromix/koffi-${platform}-
    # ${arch}`, i.e. `app/node_modules/@koromix/...`, and throws if it is absent.
    # Shipping the wrapper alone is what made PreventPinning work in dev (where
    # the binary resolves from the root node_modules) but silently do nothing in
    # the packaged app.
    - from: ../../node_modules/koffi
      to: app/node_modules/koffi
    - from: ../../node_modules/@koromix/koffi-win32-x64
      to: app/node_modules/@koromix/koffi-win32-x64

nsis:
  oneClick: true
  # Per-user install to %LOCALAPPDATA%\Programs\ (not Program Files).
  # Bun subprocess cannot read/write files in Program Files due to Windows permissions.
  perMachine: false
  deleteAppDataOnUninstall: true

linux:
  icon: resources/icon.png
  category: Utility
  maintainer: "Craft Docs Ltd. <support@craft.do>"
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "Craft-Agents-${arch}.${ext}"
  extraResources:
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
    # Bundled Bun runtime, staged by scripts/fetch-bun.ts for the target arch.
    - from: vendor/bun/bun
      to: app/vendor/bun/bun
    # Bundled uv binary for the target arch (resources/bin/<platform>-<arch>/).
    - from: resources/bin/linux-${arch}
      to: app/resources/bin/linux-${arch}
    # Pi agent server subprocess (for Pi SDK sessions).
    - from: resources/pi-agent-server
      to: app/resources/pi-agent-server
  # No platform-level `files` list here on purpose — see the note above `files`.
