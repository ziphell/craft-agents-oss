<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <style>
    /* The surface the app paints (`--background` in index.css, `BACKGROUND_HEX` in the main
       process): this document fills the page panel, and a different grey here would sit inside
       the panel's rounded corners as a band against the gutter. */
    html, body { margin: 0; padding: 0; height: 100%; background: #f7f8fa; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #080a10; }
    }
  </style>
</head>
<body></body>
</html>
